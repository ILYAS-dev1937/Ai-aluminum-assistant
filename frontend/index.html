<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAVAL AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0C1220;
      --surface:      #131D2E;
      --surface-hi:   #1A2438;
      --border:       #253044;
      --accent:       #6BAED6;
      --accent-glow:  rgba(107, 174, 214, 0.12);
      --accent-dim:   rgba(107, 174, 214, 0.4);
      --user-bg:      #1B3A54;
      --user-border:  #2A587A;
      --ai-bg:        #1A2438;
      --ai-border:    #253044;
      --text-primary: #D4E4F0;
      --text-sec:     #7A92AA;
      --text-dim:     #3E5570;
      --green:        #4CAF7D;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Shell ── */
    .shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 840px;
      margin: 0 auto;
    }

    /* ── Header — brushed-aluminum signature ── */
    .header {
      flex-shrink: 0;
      height: 62px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 13px;
      border-bottom: 1px solid var(--border);
      background:
        repeating-linear-gradient(
          106deg,
          transparent,
          transparent 3px,
          rgba(255,255,255,0.016) 3px,
          rgba(255,255,255,0.016) 6px
        ),
        linear-gradient(to right, #182840, #233655, #182840);
      position: relative;
    }

    /* subtle bottom highlight like aluminum edge */
    .header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(107,174,214,0.3) 40%, rgba(107,174,214,0.3) 60%, transparent);
    }

    .logo {
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    .logo img {
      height: 26px;
      width: auto;
      opacity: 0.92;
    }

    .header-text { line-height: 1; margin-left: 4px; }
    .header-role {
      font-size: 11px;
      color: var(--text-sec);
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .online {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-sec);
    }
    .online-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px rgba(76,175,125,0.55);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 6px rgba(76,175,125,0.55); }
      50%       { box-shadow: 0 0 10px rgba(76,175,125,0.9); }
    }

    /* ── Chat ── */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 28px 24px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scroll-behavior: smooth;
    }
    .chat::-webkit-scrollbar { width: 5px; }
    .chat::-webkit-scrollbar-track { background: transparent; }
    .chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    /* ── Empty state ── */
    .empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      padding: 32px;
      animation: fadeUp 0.4s ease both;
    }

    .empty-icon {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: var(--surface-hi);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 6px;
    }
    .empty-icon svg { width: 24px; height: 24px; stroke: var(--text-sec); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

    .empty h3 { font-size: 16px; font-weight: 500; color: var(--text-sec); }
    .empty p { font-size: 13.5px; color: var(--text-dim); max-width: 310px; line-height: 1.75; }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 14px;
    }

    .chip {
      padding: 7px 15px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--surface-hi);
      color: var(--text-sec);
      font-size: 12.5px;
      cursor: pointer;
      transition: border-color 0.18s, color 0.18s, background 0.18s;
      font-family: inherit;
    }
    .chip:hover {
      border-color: var(--accent-dim);
      color: var(--accent);
      background: var(--accent-glow);
    }

    /* ── Message rows ── */
    .row {
      display: flex;
      gap: 10px;
      max-width: 100%;
      animation: fadeUp 0.22s ease both;
    }
    .row.user { flex-direction: row-reverse; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .av {
      width: 28px; height: 28px;
      border-radius: 7px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600;
      margin-top: 3px;
    }
    .av.ai  { background: linear-gradient(145deg, #5A9EC8, #2E6A96); color: white; }
    .av.usr { background: var(--user-bg); border: 1px solid var(--user-border); color: var(--accent); }

    .bwrap {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-width: calc(100% - 76px);
    }
    .row.user .bwrap { align-items: flex-end; }

    .bub {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.7;
      word-break: break-word;
    }
    .bub.ai {
      background: var(--ai-bg);
      border: 1px solid var(--ai-border);
      border-bottom-left-radius: 3px;
      color: var(--text-primary);
    }
    .bub.usr {
      background: var(--user-bg);
      border: 1px solid var(--user-border);
      border-bottom-right-radius: 3px;
      color: #CCDEE8;
    }

    .bub strong { color: var(--accent); font-weight: 600; }
    .bub em { color: var(--text-sec); font-style: italic; }
    .bub code {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12.5px;
      background: rgba(107,174,214,0.1);
      border: 1px solid rgba(107,174,214,0.2);
      padding: 1px 5px;
      border-radius: 4px;
    }

    .ts {
      font-size: 10.5px;
      color: var(--text-dim);
      padding: 0 3px;
      font-variant-numeric: tabular-nums;
    }

    /* ── Typing indicator ── */
    .typing-row { display: flex; gap: 10px; animation: fadeUp 0.2s ease both; }
    .typing-bub {
      background: var(--ai-bg);
      border: 1px solid var(--ai-border);
      border-bottom-left-radius: 3px;
      border-radius: 12px;
      padding: 13px 16px;
      display: flex; gap: 5px; align-items: center;
    }
    .typing-bub span {
      display: block; width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-dim);
      animation: dot 1.3s ease-in-out infinite;
    }
    .typing-bub span:nth-child(2) { animation-delay: 0.14s; }
    .typing-bub span:nth-child(3) { animation-delay: 0.28s; }
    @keyframes dot {
      0%, 55%, 100% { transform: translateY(0); background: var(--text-dim); }
      28%           { transform: translateY(-5px); background: var(--accent); }
    }

    /* ── Input area ── */
    .input-area {
      flex-shrink: 0;
      padding: 14px 24px 18px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .input-box {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: #0F1826;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 10px 10px 16px;
      transition: border-color 0.18s, box-shadow 0.18s;
    }
    .input-box:focus-within {
      border-color: var(--accent-dim);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    textarea {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      resize: none;
      font-family: inherit;
      font-size: 14px;
      color: var(--text-primary);
      line-height: 1.55;
      max-height: 150px;
      overflow-y: auto;
      caret-color: var(--accent);
    }
    textarea::placeholder { color: var(--text-dim); }
    textarea::-webkit-scrollbar { width: 4px; }
    textarea::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .send {
      width: 32px; height: 32px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #0C1220;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.18s, transform 0.1s, opacity 0.18s;
    }
    .send:hover:not(:disabled) { background: #89C4E1; }
    .send:active:not(:disabled) { transform: scale(0.91); }
    .send:disabled { opacity: 0.3; cursor: not-allowed; }
    .send svg { width: 14px; height: 14px; fill: currentColor; }

    .hint {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 7px;
      text-align: right;
      letter-spacing: 0.01em;
    }

    @media (max-width: 580px) {
      .chat, .input-area { padding-left: 14px; padding-right: 14px; }
      .header { padding: 0 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>

      <p>Ask about alloy grades, profile dimensions, surface treatments, structural specs, or product availability.</p>
      <div class="chips">
        <button class="chip" onclick="quickSend(this)">Available alloy grades</button>
        <button class="chip" onclick="quickSend(this)">Standard profile dimensions</button>
        <button class="chip" onclick="quickSend(this)">Structural vs. decorative profiles</button>
        <button class="chip" onclick="quickSend(this)">Surface treatment options</button>
        <button class="chip" onclick="quickSend(this)">Request a custom quote</button>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-box">
      <textarea
        id="msg"
        rows="1"
        placeholder="Ask about aluminum profiles…"
        onkeydown="handleKey(event)"
        oninput="grow(this)"
      ></textarea>
      <button class="send" id="sendBtn" onclick="send()" aria-label="Send message">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </div>
    <div class="hint">Enter to send &nbsp;·&nbsp; Shift + Enter for new line</div>
  </div>

</div>
<script>
  let busy = false;

  function grow(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 150) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  }

  function quickSend(btn) {
    document.getElementById('msg').value = btn.textContent;
    send();
  }

  function now() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function killEmpty() {
    const el = document.getElementById('empty');
    if (el) el.remove();
  }

  function escape(t) {
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function fmt(text) {
    return escape(text)
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\n/g, '<br>');
  }

  function addMsg(role, text) {
    killEmpty();
    const chat = document.getElementById('chat');
    const isUser = role === 'user';

    const row = document.createElement('div');
    row.className = 'row' + (isUser ? ' user' : '');

    const av = document.createElement('div');
    av.className = 'av ' + (isUser ? 'usr' : 'ai');
    av.textContent = isUser ? 'U' : 'M';

    const wrap = document.createElement('div');
    wrap.className = 'bwrap';

    const bub = document.createElement('div');
    bub.className = 'bub ' + (isUser ? 'usr' : 'ai');
    bub.innerHTML = fmt(text);

    const ts = document.createElement('div');
    ts.className = 'ts';
    ts.textContent = now();

    wrap.appendChild(bub);
    wrap.appendChild(ts);
    row.appendChild(av);
    row.appendChild(wrap);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
  }

  function showTyping() {
    const chat = document.getElementById('chat');
    const row = document.createElement('div');
    row.className = 'typing-row';
    row.id = 'typing';

    const av = document.createElement('div');
    av.className = 'av ai';
    av.textContent = 'M';

    const bub = document.createElement('div');
    bub.className = 'typing-bub';
    bub.innerHTML = '<span></span><span></span><span></span>';

    row.appendChild(av);
    row.appendChild(bub);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
  }

  function hideTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  async function send() {
    if (busy) return;
    const input = document.getElementById('msg');
    const text = input.value.trim();
    if (!text) return;

    busy = true;
    document.getElementById('sendBtn').disabled = true;
    input.value = '';
    input.style.height = 'auto';

    addMsg('user', text);
    showTyping();

    try {
      const res = await fetch('http://127.0.0.1:8000/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      hideTyping();
      addMsg(
        'ai',
        data.answer,
        data.sources
        );
    } catch (err) {
      hideTyping();
      addMsg('ai', '⚠️ Could not reach the server. Please check your connection and try again.');
    } finally {
      busy = false;
      document.getElementById('sendBtn').disabled = false;
      input.focus();
    }
  }
</script>
</body>
</html>
